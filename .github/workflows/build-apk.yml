name: Build Ludo King APK

# Runs on every push to main/master, on every tag like v14 / v14.1, and by hand (Actions tab > Run workflow).
#   - APK is always saved as an "artifact" of the run (Actions > the run > Artifacts).
#   - If you push a tag (git tag v14.1 && git push --tags) the APK is also attached to a GitHub Release.
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub runner already has the Android SDK (ANDROID_HOME). No extra setup action needed.
      - name: Android SDK licenses + platform 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" || echo "::warning::sdkmanager could not install platform 34 (maybe already there); Gradle will try itself"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Firebase SDK (offline copy inside the APK)
        run: |
          mkdir -p www/lib
          for f in firebase-app-compat.js firebase-database-compat.js; do
            if [ ! -s "www/lib/$f" ]; then
              curl -fsSL --retry 3 -o "www/lib/$f" "https://www.gstatic.com/firebasejs/10.12.2/$f" \
                || { echo "::warning::could not download $f - the game will load it from the CDN instead"; rm -f "www/lib/$f"; }
            fi
          done
          ls -la www/lib

      - name: Read app version (www/js/version.js)
        id: ver
        run: |
          V=$(grep -oP "APP_VERSION\s*=\s*['\"]\K[0-9]+(\.[0-9]+)*" www/js/version.js)
          echo "App version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Name the APK + check signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Ludo_King_v${{ steps.ver.outputs.version }}.apk"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs "Ludo_King_v${{ steps.ver.outputs.version }}.apk" || true
          ls -la Ludo_King_v*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ludo_King_v${{ steps.ver.outputs.version }}
          path: Ludo_King_v*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ludo_King_v*.apk
