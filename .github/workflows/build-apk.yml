name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Same key for every build = players can update over the old version.
      # (Optional) override with repository secrets KEYSTORE_PASSWORD / KEYSTORE_ALIAS.
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'ludoking-2026' }}
      KS_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'ludoking' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Prepare Android project
        run: bash scripts/prepare-android.sh

      # Maven Central sometimes answers "429 Too Many Requests" to GitHub runners.
      # Use Google's mirror of Maven Central first (Central stays as the fallback).
      - name: Gradle mirror
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          allprojects {
              buildscript {
                  repositories { maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' } }
              }
              repositories {
                  maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
              }
          }
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ok=0
          for i in 1 2 3; do
            if ./gradlew assembleRelease --no-daemon -Dorg.gradle.internal.repository.max.retries=6 -Dorg.gradle.internal.repository.initial.backoff=2000; then
              ok=1; break
            fi
            echo "Build attempt $i failed - retrying in 45 seconds..."
            sleep 45
          done
          [ "$ok" = "1" ]

      - name: Align and sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Unsigned: $UNSIGNED  | build-tools: $BT"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks signing/ludoking.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" \
            --key-pass "pass:$KS_PASS" \
            --out LudoKing.apk aligned.apk
          "$BT/apksigner" verify --print-certs LudoKing.apk | head -3

      - name: Read version
        id: ver
        run: echo "code=$(cat .apk-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LudoKing-v${{ steps.ver.outputs.code }}
          path: LudoKing.apk

      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: Ludo King v${{ steps.ver.outputs.code }}
          files: LudoKing.apk
