name: Build Ludo King APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_VERSION_NAME: "11.2"
  APP_VERSION_CODE: "112"
  APK_BASENAME: "LudoKing-11.2"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Optional: signed release APK er jonno (APK_BUILD.md dekho)
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle Firebase SDK (offline use)
        run: |
          mkdir -p lib
          for f in firebase-app-compat.js firebase-database-compat.js; do
            if [ ! -s "lib/$f" ]; then
              curl -fsSL "https://www.gstatic.com/firebasejs/10.12.2/$f" -o "lib/$f" \
                || { echo "::warning::$f download hoy nai - game CDN theke load korbe"; rm -f "lib/$f"; }
            fi
          done
          ls -la lib

      - name: Prepare web files
        run: node scripts/build-www.js

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android project (version, icon, portrait, splash)
        run: bash scripts/patch-android.sh

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect debug APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${APK_BASENAME}-debug.apk"

      - name: Build signed release APK (shudhu secrets thakle)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/dist/${APK_BASENAME}.apk" \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$GITHUB_WORKSPACE/dist/${APK_BASENAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoKing-11.2-apk
          path: dist/*.apk
          if-no-files-found: error
