plugins {
    id 'com.android.application'
}

android {
    // Package id (app er unique ID). Bodlate chaile ekhane + AndroidManifest/java folder er nam ek-i rakhte hobe.
    namespace 'com.sck.ludolite'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sck.ludolite'
        minSdk 21
        targetSdk 34
        // GitHub Actions protibar -PversionCode=<run number> dey, tai notun APK purono tar upor install hoy
        versionCode Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
        versionName '1.0'
    }

    // Game er sob file repo r www/ folder e. Gradle oita APK er assets e dhukiye dey.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }

    signingConfigs {
        // Default: repo te thaka sideload.keystore (nijer keystore dite chaile GitHub Secrets e dao, BUILD_APK.md dekho)
        sideload {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'sideload.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'ludoking'
            keyAlias System.getenv('KEY_ALIAS') ?: 'ludo'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'ludoking'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            signingConfig signingConfigs.sideload
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // WebViewAssetLoader: game file gulo https://appassets.androidplatform.net/ theke serve kore (font/sound/localStorage thikmoto kaj kore)
    implementation 'androidx.webkit:webkit:1.12.1'
}
