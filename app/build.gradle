plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludoking.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ludoking.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed signing key so every build has the same signature (updates install over old versions).
    // For sideloading only. If you publish on Google Play, create your own private key instead.
    signingConfigs {
        release {
            storeFile file('ludoking.jks')
            storePassword 'ludoking123'
            keyAlias 'ludoking'
            keyPassword 'ludoking123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
